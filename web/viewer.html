<!DOCTYPE html>
<!--
  Standalone JSON viewer for knot's plot_save() output.

  Drop a *.json file (or "Open" a path with the file picker) and the
  page renders every trace in the file on one set of axes.

  This is a CLI-companion to the in-browser playground:

      ./knot --exec myprog.knot   ->   writes results.json
      open web/viewer.html         ->   drag results.json onto the page

  Works from a file:// URL -- no server needed. Plotly is loaded
  from a CDN.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knot — plot viewer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  :root {
    --bg: #1a1a1a;
    --fg: #e8e8e8;
    --dim: #888;
    --panel: #232323;
    --border: #303030;
    --accent: #7ec699;
    --error: #f08080;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 8px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header .dim { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  button, label.btn {
    font: inherit;
    background: #2a2a2a;
    color: var(--fg);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  label.btn input { display: none; }
  #status { font-size: 12px; color: var(--dim); }
  #status.error { color: var(--error); }
  #plot { flex: 1; min-height: 0; }
  #drop-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(122, 162, 247, 0.15);
    border: 3px dashed #7aa2f7;
    z-index: 10;
    pointer-events: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #c0caf5;
  }
  body.dragging #drop-overlay { display: flex; }
  #placeholder {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 13px;
    text-align: center;
    padding: 40px;
  }
  #placeholder code { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Knot</h1>
  <span class="dim">plot viewer · drop a JSON file written by <code>plot_save()</code></span>
  <span class="spacer"></span>
  <label class="btn">
    Open file
    <input type="file" id="file-input" accept=".json,application/json">
  </label>
  <span id="status"></span>
</header>

<div id="plot"></div>
<div id="placeholder">
  Drop a JSON file here, or click "Open file" above.<br><br>
  Generate one with:<br>
  <code>plot_save("out.json", x, y, "label")</code><br>
  <code>plot_save("out.json", x, mat_Y, "trace")</code>
</div>
<div id="drop-overlay">drop the JSON file</div>

<script>
const plotDiv     = document.getElementById('plot');
const placeholder = document.getElementById('placeholder');
const status      = document.getElementById('status');
const fileInput   = document.getElementById('file-input');

function render(json) {
  if (!json || !Array.isArray(json.traces)) {
    status.textContent = 'unrecognized JSON: expected { "traces": [...] }';
    status.classList.add('error');
    return;
  }
  const data = json.traces.map(t => ({
    x: t.x,
    y: t.y,
    name: t.name || 'trace',
    mode: 'lines',
    type: 'scattergl',
  }));
  const layout = {
    paper_bgcolor: '#1a1a1a',
    plot_bgcolor:  '#1a1a1a',
    font:   { color: '#e8e8e8', family: 'inherit' },
    margin: { l: 50, r: 20, t: 20, b: 40 },
    xaxis:  { gridcolor: '#333', zerolinecolor: '#555' },
    yaxis:  { gridcolor: '#333', zerolinecolor: '#555' },
    legend: { bgcolor: 'rgba(0,0,0,0)' },
  };
  const config = { displaylogo: false, responsive: true };
  Plotly.react(plotDiv, data, layout, config);
  placeholder.style.display = 'none';
  plotDiv.style.display = 'block';
  status.textContent = `loaded ${json.traces.length} trace${json.traces.length === 1 ? '' : 's'}`;
  status.classList.remove('error');
}

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      render(json);
    } catch (err) {
      status.textContent = 'JSON parse error: ' + err.message;
      status.classList.add('error');
    }
  };
  reader.onerror = () => {
    status.textContent = 'read error: ' + reader.error;
    status.classList.add('error');
  };
  reader.readAsText(file);
}

fileInput.addEventListener('change', e => {
  if (e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
});

// Drag-and-drop anywhere on the page.
let dragDepth = 0;
window.addEventListener('dragenter', e => {
  e.preventDefault();
  dragDepth++;
  document.body.classList.add('dragging');
});
window.addEventListener('dragleave', e => {
  e.preventDefault();
  dragDepth--;
  if (dragDepth <= 0) document.body.classList.remove('dragging');
});
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove('dragging');
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
    loadFile(e.dataTransfer.files[0]);
  }
});
</script>
</body>
</html>
